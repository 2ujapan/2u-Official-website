<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>驗證中 - 2U日本代購 🦋</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #fef9f3; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(255, 184, 153, 0.2); width: 85%; max-width: 350px; text-align: center; }
        .btn { background: #ffb899; color: white; padding: 12px; border-radius: 30px; border: none; width: 100%; font-weight: bold; cursor: pointer; margin-top: 20px; }
        input { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 10px; margin-top: 10px; box-sizing: border-box; }
        #loading { color: #999; }
    </style>
</head>
<body>

<div class="card">
    <div id="statusMsg">🦋 正在載入 LINE...</div>
    
    <div id="bindBox" style="display:none;">
        <h3 style="margin:0;">歡迎加入連線 🦋</h3>
        <p style="font-size: 14px; color: #888;">請輸入您的社群名稱以利對帳</p>
        <input type="text" id="userNameInput" placeholder="例如：Wen / 小明">
        <button class="btn" onclick="doBind()">確認綁定並進入商城</button>
    </div>
</div>

<script>
    // 1. 設定區 (請務必填寫正確)
    const MY_LIFF_ID = "2009620784-76eBZ9C0"; 
    const MY_GAS_URL = "https://script.google.com/macros/s/AKfycbyCPGJ0BAKn3f006jc-QnThoaYl8kZNWBv9ywXfNXxmc1P0kid5N2ZC3LP8Ul-E13CEfw/exec"; 

    async function start() {
        try {
            await liff.init({ liffId: MY_LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }
            
            const profile = await liff.getProfile();
            const uid = profile.userId;
            
            // 去問 GAS：這個 UID 綁定過了嗎？
            fetch(`${MY_GAS_URL}?uid=${uid}`)
                .then(res => res.json())
                .then(data => {
                    // 只要回傳有名字，代表已經是會員，直接踢回首頁
                    if (data.name) {
                        document.getElementById('statusMsg').innerText = "驗證成功，跳轉中...";
                        window.location.replace("index.html"); // 使用 replace 防止按返回鍵又回到這
                    } else {
                        // 真的沒綁定過，才顯示輸入框
                        document.getElementById('statusMsg').style.display = 'none';
                        document.getElementById('bindBox').style.display = 'block';
                    }
                })
                .catch(err => {
                    document.getElementById('statusMsg').innerText = "連線異常，請重新整理";
                });

        } catch (err) {
            document.getElementById('statusMsg').innerText = "啟動失敗：" + err;
        }
    }

    function doBind() {
        const name = document.getElementById('userNameInput').value.trim();
        if (!name) return alert("請輸入名字唷！");
        
        const uid = liff.getContext().userId;
        document.getElementById('bindBox').style.display = 'none';
        document.getElementById('statusMsg').style.display = 'block';
        document.getElementById('statusMsg').innerText = "正在建立您的專屬檔案...";

        fetch(`${MY_GAS_URL}?uid=${uid}&name=${encodeURIComponent(name)}`)
            .then(res => res.json())
            .then(data => {
                alert("綁定成功！");
                window.location.replace("index.html"); // 綁完立刻進首頁
            });
    }

    start();
</script>

</body>
</html>
