<div id="queryArea">
    <div id="bindingForm" style="display:none;">
        <p>偵測到您尚未綁定社群名稱，請輸入一次以完成串接：</p>
        <input type="text" id="inputName" placeholder="請輸入您的社群名稱">
        <button onclick="startBind()" class="btn">確認綁定</button>
    </div>

    <div id="resultArea" style="display:none;">
        <h3 id="displayName"></h3>
        <p>📦 訂單：<span id="orderId"></span></p>
        <p>✨ 狀態：<span id="orderStatus"></span></p>
    </div>
</div>

<script>
    const uid = sessionStorage.getItem('lineUid');
    const apiUrl = "https://script.google.com/macros/s/AKfycby8Wi3zuuUzQsQLNNWenHNobkFun7J4tHX2RcT3qNqbbEERvCYSU4TLCqVDde1xJHFjow/exec";

    // 一進來先檢查有沒有綁定過
    fetch(`${apiUrl}?uid=${uid}`)
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                showData(data);
            } else {
                document.getElementById('bindingForm').style.display = 'block';
            }
        });

    function startBind() {
        const name = document.getElementById('inputName').value;
        fetch(`${apiUrl}?uid=${uid}&name=${name}`)
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                location.reload(); // 綁定成功後重新整理就看到資料了
            });
    }

    function showData(data) {
        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('displayName').innerText = data.name + " 的訂單";
        document.getElementById('orderId').innerText = data.orderId;
        document.getElementById('orderStatus').innerText = data.orderStatus;
    }
</script>
