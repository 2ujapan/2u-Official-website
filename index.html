<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2U日本代購 🦋</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f9f9f9; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-line { display: block; background: #06C755; color: white; padding: 15px; border-radius: 30px; text-decoration: none; font-weight: bold; margin: 20px 0; cursor: pointer; border: none; width: 100%; font-size: 16px; }
        .profile-img { width: 80px; border-radius: 50%; border: 3px solid #06C755; }
        #afterLogin { display: none; } /* 預設隱藏登入後的內容 */
    </style>
</head>
<body>

<div class="container">
    <h1>2U日本代購 🦋</h1>
    <p>專屬於您的連線採購小管家</p>

    <div id="beforeLogin">
        <button class="btn-line" onclick="loginWithLine()">🍀 點擊 LINE 登入查詢訂單</button>
        <p style="font-size: 12px; color: #888;">登入後即可查看您的專屬採購進度</p>
    </div>

    <div id="afterLogin">
        <img id="userImg" class="profile-img" src="" alt="User">
        <h3 id="userName">載入中...</h3>
        <hr>
        <a href="check.html" class="btn-line">進入訂單查詢頁面 ></a>
        <button onclick="logout()" style="background:none; border:none; color: #999; cursor: pointer;">登出帳號</button>
    </div>
</div>

<script>
    // 1. 初始化 LIFF
    async function initLIFF() {
        try {
            await liff.init({ liffId: "2009620784-76eBZ9C0" }); // 記得換成你的 LIFF ID
            if (liff.isLoggedIn()) {
                showUserProfile();
            }
        } catch (error) {
            console.log("LIFF 初始化失敗", error);
        }
    }

    // 2. 點擊按鈕才執行的登入函數
    function loginWithLine() {
        if (!liff.isLoggedIn()) {
            liff.login();
        }
    }

    // 3. 登入後顯示資訊
    async function showUserProfile() {
        const profile = await liff.getProfile();
        document.getElementById("beforeLogin").style.display = "none";
        document.getElementById("afterLogin").style.display = "block";
        document.getElementById("userName").innerText = profile.displayName + "，您好！";
        document.getElementById("userImg").src = profile.pictureUrl;
        
        // 將姓名存入 Session，讓 check.html 可以直接用
        sessionStorage.setItem('lineName', profile.displayName);
    }

    // 4. 登出功能 (選擇性)
    function logout() {
        liff.logout();
        window.location.reload();
    }

    initLIFF();
</script>

</body>
</html>
