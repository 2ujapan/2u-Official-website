<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2U日本代購 🦋</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #fef9f3; padding: 40px 20px; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { display: block; background: #06C755; color: white; padding: 15px; border-radius: 30px; text-decoration: none; margin-top: 20px; border: none; width: 100%; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>2U日本代購 🦋</h1>
        <div id="beforeLogin">
            <p>請先登入 LINE 以查詢您的個人訂單</p>
            <button class="btn" onclick="liff.login()">🍀 LINE 快速登入</button>
        </div>
        <div id="afterLogin" style="display:none;">
            <img id="userImg" style="width:80px; border-radius:50%;">
            <h3 id="userName"></h3>
            <a href="check.html" class="btn">查看訂單進度 ></a>
        </div>
    </div>

    <script>
        async function init() {
            await liff.init({ liffId: "2009620784-76eBZ9C0" });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                // 關鍵：拿到 userId 並存起來
                sessionStorage.setItem('lineUid', profile.userId);
        
                document.getElementById('beforeLogin').style.display = 'none';
                document.getElementById('afterLogin').style.display = 'block';
                document.getElementById('userName').innerText = profile.displayName + "，您好";
                document.getElementById('userImg').src = profile.pictureUrl;
            }
            }
        
        init();
    </script>
</body>
</html>
