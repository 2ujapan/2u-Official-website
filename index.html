<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2U日本代購 - 登入</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .profile-img { width: 100px; border-radius: 50%; margin-bottom: 10px; }
        .btn { display: inline-block; padding: 10px 20px; background: #06C755; color: white; border-radius: 20px; text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="loading">載入中...</div>
    
    <div id="content" style="display:none;">
        <img id="pictureUrl" class="profile-img" src="" alt="頭貼">
        <h2 id="displayName">你好！</h2>
        <p>歡迎來到 2U日本代購</p>
        
        <a href="check.html" class="btn">🍀 查詢我的訂單紀錄</a>
    </div>

    <script>
        async function main() {
            // 這裡填入你在 LINE Developers 取得的 LIFF ID
            await liff.init({ liffId: "https://liff.line.me/2009620784-76eBZ9C0" });

            if (!liff.isLoggedIn()) {
                // 如果沒登入，強制執行登入
                liff.login();
            } else {
                // 登入後，抓取個人資訊
                const profile = await liff.getProfile();
                document.getElementById('displayName').innerText = "你好，" + profile.displayName + " 🦋";
                document.getElementById('pictureUrl').src = profile.pictureUrl;
                
                // 隱藏載入中，顯示內容
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                // (進階) 你可以把 profile.displayName 存起來，方便 check.html 使用
                sessionStorage.setItem('userName', profile.displayName);
            }
        }
        main();
    </script>
</body>
</html>
